[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
# aws-lc-rs (reqwest 0.13 default crypto) is Apache-2.0 OR ISC. No OpenSSL entry needed.
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2024-0436", # paste - unmaintained, no safe upgrade available
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The devdocs-testkit workspace dep is path-only (publish = false; a version
# here would keep the dev-dependency in the published manifest, where it
# cannot resolve). This keeps the wildcard lint for version specs while
# allowing path-only dev-dependencies like testkit.
allow-wildcard-paths = true
highlight = "all"

# Workspace crates are declared in [workspace.dependencies] with path + version
# (testkit: path-only, see above), so no skip entries exist.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
