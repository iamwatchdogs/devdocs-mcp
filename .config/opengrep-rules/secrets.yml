# Local SAST rule set for `just opengrep`. Committed on purpose: the gate
# must run offline, so it never pulls rules from a registry. The rule IDs
# live in the devdocs.* namespace to stay independent of the Codacy cloud
# ruleset, whose findings carry their own nosemgrep suppressions.
#
# The redaction module (crates/devdocs-model/src/redaction.rs) is exempt:
# its tests hold synthetic secret-shaped fixtures on purpose, because
# matching those shapes is the module's job (docs/implementation/09
# §Secrets and redaction). trivy-secret.yaml is exempt for the same
# reason: its allow rule names the synthetic literals so trivy can skip
# them. The generic pattern-regex rules cannot honor inline
# suppressions, so the exemptions live here instead of on the flagged
# lines. The ingest pipeline fixture
# (crates/devdocs-ingest/tests/pipeline_fixture.rs) is exempt from the
# github-token rule for the same reason: its secret-bearing paragraphs
# carry whole synthetic ghp_ literals, exactly the shape the redaction
# output gate must catch at serving time.
rules:
  - id: devdocs.secrets.aws-access-key
    languages: [generic]
    severity: ERROR
    message: Possible hard-coded AWS access key ID. Load it from the environment or a config file instead.
    pattern-regex: AKIA[0-9A-Z]{16}
    paths:
      exclude:
        - crates/devdocs-model/src/redaction.rs
        - trivy-secret.yaml

  - id: devdocs.secrets.github-token
    languages: [generic]
    severity: ERROR
    message: Possible hard-coded GitHub token. Load it from the environment or a config file instead.
    pattern-regex: gh[pousr]_[A-Za-z0-9]{36,}
    paths:
      exclude:
        - crates/devdocs-model/src/redaction.rs
        - crates/devdocs-ingest/tests/pipeline_fixture.rs
        - trivy-secret.yaml

  - id: devdocs.secrets.private-key-block
    languages: [generic]
    severity: ERROR
    message: Possible embedded private key. Reference a key file instead of committing key material.
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |PGP |DSA |ENCRYPTED )?PRIVATE KEY(-[A-Z]+)?-----'
    paths:
      exclude:
        - crates/devdocs-model/src/redaction.rs
        - trivy-secret.yaml
