name: setup-rust
description: >-
  Shared Rust setup for CI jobs: toolchain, cache, and optional cargo tools.
  Used by every ci.yml job that compiles; keep release.yml's own setup inline
  (it pins per-target toolchains and runs under a different permission set).
inputs:
  toolchain:
    description: >-
      Toolchain to install (version or "stable"). When omitted, the channel
      is read from rust-toolchain.toml, which is the single source of truth
      for the pinned toolchain. Only set this for legs that deliberately
      differ (e.g. the MSRV job).
    required: false
    default: ""
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
  tools:
    description: >-
      Comma-separated tools for taiki-e/install-action. Deliberately UNPINNED
      (unlike release.yml's cargo-zigbuild@0.24.0): Renovate cannot bump
      install-action inputs, so a pin would go stale silently. Security
      scanners and CI dev tools should float; the release-critical toolchain
      is pinned where it is used.
    required: false
    default: ""
  cache:
    description: >-
      Whether to run Swatinem/rust-cache. Leave true for compile jobs; set
      false for jobs that never compile (e.g. CodeQL build-mode: none) so
      they neither pay for nor pollute the shared cache.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - id: resolve-toolchain
      # dtolnay/rust-toolchain hard-requires a `toolchain` input (it does not
      # consult rust-toolchain.toml itself), so resolve the channel here when
      # the caller omitted one.
      if: inputs.toolchain == ''
      shell: bash
      run: |
        channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        if [ -z "${channel}" ]; then
          echo "::error::Could not read channel from rust-toolchain.toml and no explicit toolchain input was given" >&2
          exit 1
        fi
        echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ inputs.toolchain != '' && inputs.toolchain || steps.resolve-toolchain.outputs.channel }}
        components: ${{ inputs.components }}
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - if: inputs.tools != ''
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        tool: ${{ inputs.tools }}
