name: ci

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - "deny.toml"
      - "justfile"
      - "rustfmt.toml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - "deny.toml"
      - "justfile"
      - "rustfmt.toml"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  INSTA_FORCE_UPDATE: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          components: rustfmt
          tools: just
      - run: just fmt-check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          components: clippy
          tools: just
      - run: just lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          tools: cargo-nextest,just
      - run: just test

  test-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          tools: just
      - run: just test-doc

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.90.0"
          tools: just
      - run: just msrv

  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          tools: just
      - run: just features

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          components: llvm-tools-preview
          tools: cargo-llvm-cov,just
      - run: just coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          # codecov-action v4+ supports tokenless uploads only from fork PRs
          # to public repos; main-branch uploads need a token (or a codecov
          # -side opt-in). An unset secret therefore degrades main uploads to
          # a logged failure — which does not fail the job (fail_ci_if_error
          # is unset by default).
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          tools: just
      - run: just docs

  commits:
    # The lefthook commit-msg hook runs only on developer machines; squash
    # merges land the PR title as the commit that release-plz parses for
    # version bumps. A non-conventional title would silently produce no
    # release PR, so the CI gate enforces the same rule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const ok = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$/.test(title);
            if (!ok) {
              core.setFailed(`PR title "${title}" is not a Conventional Commit (type(scope): subject, subject <= 72 chars) — see lefthook.yml commit-msg.`);
            }

  gate:
    # Single aggregate check for branch protection: matrix legs publish
    # per-OS check names (e.g. "test (ubuntu-latest)"), so enumerating them
    # in required checks silently desyncs when a job or matrix leg changes.
    # Require only "gate" instead.
    needs: [fmt, lint, test, test-doc, msrv, features, deny, coverage, docs, commits]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "All ci.yml jobs passed (or were skipped by design, e.g. commits on push)."
