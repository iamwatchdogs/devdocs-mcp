name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:
  # Weekly drift observation: the zizmor binary floats at latest, so a new
  # rule release can flip the main-branch push check red with no PR warning.
  # The scheduled run surfaces rule-pack drift independently of pushes.
  schedule:
    - cron: "23 4 * * 3"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The zizmor version floats at latest on purpose: security
          # scanners must see new releases (same policy as the
          # install-action tools in ci.yml and audit.yml).
          persona: regular
          # Annotations mode, not the default Advanced Security/SARIF mode:
          # with --format=sarif zizmor always exits 0 (findings are
          # communicated through the Security tab instead), which would make
          # this check a no-op. Annotations preserve the real exit code, so
          # findings fail the check and render inline on the PR diff.
          advanced-security: false
          annotations: true
