name: audit

on:
  schedule:
    # Daily: cargo-deny and cargo-audit.
    - cron: "17 3 * * *"
    # Weekly: cargo-machete.
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  machete:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  report:
    needs: [deny, audit, machete]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = `Dependency audit failed (${new Date().toISOString().slice(0, 10)})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependencies",
              per_page: 100,
            });
            if (!existing.data.some((issue) => issue.title.startsWith("Dependency audit failed"))) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["dependencies"],
                body: [
                  "A scheduled dependency audit job failed.",
                  "",
                  `Run: ${runUrl}`,
                  "",
                  "Check `cargo deny check`, `cargo audit`, and `cargo machete` logs.",
                ].join("\n"),
              });
            }
