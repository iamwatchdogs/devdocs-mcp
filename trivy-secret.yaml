# Trivy secret-scanning config, auto-loaded by `just trivy`. The
# redaction module (docs/implementation/09 §Secrets and redaction) tests
# hold synthetic secret-shaped fixtures on purpose — matching those
# shapes is the module's job — so the synthetic literals are exempt from
# the secret scanner. The regex names the exact synthetic substrings, so
# no real credential can match it, and the `path` scoping confines the
# exemption to the fixture-bearing file and this config itself (whose
# regex text carries the literals); every other file scans at full
# severity. The PEM body alternative is bounded to the exact synthetic
# body — an unanchored fragment would suppress any secret that contains
# it in any file.
allow-rules:
  - id: synthetic-redaction-fixtures
    description: The synthetic fixture literals of the redaction module tests
    path: "crates/devdocs-model/src/redaction\\.rs|trivy-secret\\.yaml"
    regex: "ghp_0123456789abcdefghijklmnopqrstuvwxyz|abcdEFGHijklMNOPqrstT3BlbkFJuvwxyz|wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY|(?:MIIEvQ){16}"
