name: publish

on:
  workflow_dispatch:

# Workspace crates are versioned together (release-plz single-version mode).
# devdocs-testkit stays `publish = false` and is skipped by release-plz.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
      - name: OIDC token for crates.io
        id: cratesio
        uses: rust-lang/crates-io-auth-action@v1
      - uses: MarcoIeni/release-plz-action@v0.5.147
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
