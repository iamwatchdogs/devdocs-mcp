[package]
name = "devdocs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and MCP server for devdocs"

[lib]
name = "devdocs"
path = "src/lib.rs"

[[bin]]
name = "devdocs"
path = "src/main.rs"

[features]
default = []
# Declared now so `just features` exercises every build shape. Both forward to
# the core crates once the store and ingest layers land (docs/implementation/12).
exact-tokens = []
embeddings = []

[dependencies]
devdocs-ingest.workspace = true
devdocs-model.workspace = true
devdocs-retrieve.workspace = true
devdocs-store.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
devdocs-testkit.workspace = true
insta.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
