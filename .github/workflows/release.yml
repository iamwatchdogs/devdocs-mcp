name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-latest, zig: false, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-latest, zig: false, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, zig: false, smoke: true }
          # Windows ARM64 is out of scope (docs 01); do not add a Windows ARM64 target.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: true, smoke: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: true, smoke: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        shell: bash
        run: |
          python3 -m pip install --user ziglang==0.17.0 cargo-zigbuild==0.24.0
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild -p devdocs --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build -p devdocs --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/devdocs"
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          "${bin}" --version
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="devdocs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${out}"
          if [[ -f "target/${{ matrix.target }}/release/devdocs.exe" ]]; then
            cp "target/${{ matrix.target }}/release/devdocs.exe" "dist/${out}/"
          else
            cp "target/${{ matrix.target }}/release/devdocs" "dist/${out}/"
          fi
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            (cd dist && 7z a "${out}.zip" "${out}" >/dev/null)
            (cd dist && if command -v sha256sum >/dev/null 2>&1; then sha256sum "${out}.zip" > "${out}.zip.sha256"; else shasum -a 256 "${out}.zip" > "${out}.zip.sha256"; fi)
          else
            (cd dist && tar -czf "${out}.tar.gz" "${out}")
            (cd dist && if command -v sha256sum >/dev/null 2>&1; then sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256"; else shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"; fi)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Smoke test (linux gnu)
        shell: bash
        run: |
          archive="dist/devdocs-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/devdocs-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu/devdocs" --version
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
