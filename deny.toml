[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
# aws-lc-rs (reqwest 0.13 default crypto) is Apache-2.0 OR ISC. No OpenSSL entry needed.
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2024-0436", # paste - unmaintained, no safe upgrade available
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Workspace crates are declared in [workspace.dependencies] with path + version,
# so they are not wildcard dependencies and need no skip entries.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
