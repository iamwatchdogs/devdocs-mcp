name: scorecard

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "SECURITY.md"
  schedule:
    # Weekly: supply-chain posture re-check.
    - cron: "19 5 * * 2"
  # Re-run when branch protection or rulesets change, so the
  # Branch-Protection score tracks the current configuration.
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

# Not cancelled: a cancelled run reports `cancelled`, never surfaces a
# regression, and drops the scheduled supply-chain signal.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results: true only accepts results published from the
    # default branch; this guard turns an off-branch dispatch into a clean
    # skip instead of an API failure (official starter's guard, minus its
    # pull_request clause: this workflow has no PR trigger).
    if: github.event.repository.default_branch == github.ref_name
    # publish_results: true API-enforces this shape: no job-level env,
    # defaults, containers, or services, and no step beyond checkout,
    # scorecard-action, upload-artifact, and upload-sarif below.
    permissions:
      contents: read
      actions: read
      # security-events: write uploads results.sarif to the Security tab.
      security-events: write
      # id-token: write signs the results uploaded to the OpenSSF API. The
      # crates.io trusted publisher is scoped to the `release` environment,
      # so this OIDC token is rejected there (docs 09).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the OpenSSF API. Requires a public repo.
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
