name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Two near-simultaneous tag pushes must not run the 7-leg matrix twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-15, zig: false, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-15, zig: false, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, zig: false, smoke: true }
          # Windows ARM64 is out of scope (docs 01); do not add a Windows ARM64 target.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: true, smoke: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: true, smoke: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true, smoke: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Dependency build scripts run in this job; do not leave the job
          # token in .git/config for them to read.
          persist-credentials: false
      - name: Verify tag is on main
        shell: bash
        # Branch protection gates main pushes, not tag pushes; without this
        # check any manually pushed v*.*.* tag would build, attest, and
        # publish binaries from a commit that never passed ci.yml.
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Verify tag name is semver
        shell: bash
        # Defense-in-depth on top of the `v*.*.*` trigger glob, which also
        # matches names like `v1.2.3$(cmd)`: only accept well-formed semver
        # tags so the ref name is safe to embed in archive names and gh calls
        # below without quoting concerns.
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a semver tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi
      - id: toolchain
        name: Resolve pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          # Match TOML basic (") and literal (') strings, with optional
          # surrounding whitespace; the BRE backreference keeps the quotes
          # paired (ERE backreferences are not POSIX-defined).
          channel="$(sed -n "s/^[[:space:]]*channel[[:space:]]*=[[:space:]]*\([\"']\)\([^\"']*\)\1.*/\2/p" rust-toolchain.toml | head -n 1)"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # Deliberately no rust-cache here: a release build must not depend on
      # cache state that PR workflows can write (docs 11).
      - name: Install zig (PyPI)
        if: matrix.zig
        shell: bash
        run: |
          # ziglang ships on PyPI only. pip --require-hashes pins the exact
          # wheel digests (x86_64 + aarch64 ubuntu runners) fetched from
          # https://pypi.org/pypi/ziglang/0.17.0/json at pin time; bump the
          # version and both hashes together. cargo-zigbuild itself comes
          # from taiki-e/install-action below, which embeds per-release
          # checksums.
          cat > "${RUNNER_TEMP}/ziglang-requirements.txt" <<'REQ'
          ziglang==0.17.0 \
              --hash=sha256:97079827064a7492cce5541ceb438ae8003ce1e54e399676da2d62fb7a5dc08b \
              --hash=sha256:d2804f94f54f7fcf8169f4b212a619ad688a4e2e6592e976f0cf2e58e2cd8af3
          REQ
          python3 -m pip install --user --require-hashes -r "${RUNNER_TEMP}/ziglang-requirements.txt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-zigbuild@0.24.0
      - name: Build (zigbuild)
        if: matrix.zig
        shell: bash
        run: cargo zigbuild -p devdocs --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.zig }}
        shell: bash
        run: cargo build -p devdocs --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/devdocs"
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          "${bin}" --version
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="devdocs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${out}"
          if [[ -f "target/${{ matrix.target }}/release/devdocs.exe" ]]; then
            cp "target/${{ matrix.target }}/release/devdocs.exe" "dist/${out}/"
          else
            cp "target/${{ matrix.target }}/release/devdocs" "dist/${out}/"
          fi
          # sha256sum comes with Git Bash on Windows runners and coreutils on
          # Linux; macOS ships only shasum (Perl), not GNU coreutils.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            (cd dist && 7z a "${out}.zip" "${out}" >/dev/null && sha256sum "${out}.zip" > "${out}.zip.sha256")
          else
            (cd dist && tar -czf "${out}.tar.gz" "${out}")
            if [[ "${RUNNER_OS}" == "macOS" ]]; then
              (cd dist && shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256")
            else
              (cd dist && sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256")
            fi
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          # Only the archives and their checksums; the unpacked staging
          # directories under dist/ are not consumed by any step.
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout: this job only consumes downloaded artifacts, and the
      # release step gets its repo from GH_REPO (see below).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Smoke test (linux gnu)
        shell: bash
        run: |
          archive="dist/devdocs-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/devdocs-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu/devdocs" --version
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repo from a git
          # remote and must be told explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Idempotent re-runs: keep an existing release and its notes
          # (release.yml owns the notes; see docs 11) and only re-upload the
          # assets; create the release with generated notes otherwise.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
              dist/*.tar.gz dist/*.zip dist/*.sha256
          fi
