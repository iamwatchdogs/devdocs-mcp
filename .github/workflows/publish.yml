name: publish

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "release-plz.toml"
  workflow_dispatch:

# Workspace crates are versioned together (release-plz single-version mode,
# realized via Cargo workspace version inheritance; see release-plz.toml).
# devdocs-testkit stays `publish = false` and is skipped by release-plz.
# Setup (one-time): crates.io Trusted Publisher + the release GitHub App —
# see docs/implementation/11-ci-cd-release.md "Publish to crates.io".
permissions:
  contents: read

jobs:
  release-plz-pr:
    # Opens or updates the release PR. The GitHub App token lets its PR event
    # start CI without the approval required for GITHUB_TOKEN-created PRs.
    #
    # main-only: a manual dispatch from a feature branch must never evaluate
    # (let alone publish) non-main state; push events to main satisfy this.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        name: Resolve pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Check release App credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${CLIENT_ID}" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID is not set. Add the GitHub App Client ID as a repository variable — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
          if [ -z "${PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_PRIVATE_KEY is not set. Add the GitHub App private key as a repository secret — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: devdocs-mcp
          permission-contents: write
          permission-pull-requests: write
      # Without `command: release-pr` the action runs BOTH release-pr and
      # release; this job must only open/update the release PR.
      - uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}

  release-plz-release:
    # Publishes crates and creates the version tag once the release PR is
    # merged; no-ops otherwise. The GitHub App token lets the version-tag push
    # start release.yml for the binaries; GITHUB_TOKEN does not start workflows
    # for push events. release.yml owns the GitHub release and its notes
    # (release-plz.toml sets
    # git_release_enable = false).
    #
    # No concurrency group, deliberately (upstream guidance): with
    # cancel-in-progress: false a new queued run still replaces a pending
    # one, which can silently skip a release. A superseded run is mostly
    # self-healing — the newer run publishes the same or newer versions —
    # and a skipped release is worse than a doubled one.
    # main-only: a manual dispatch from a feature branch must never publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment gate for trusted publishing: the crates.io Trusted
    # Publisher entry names this environment, so OIDC tokens minted outside
    # it (e.g. by a compromised release.yml build leg, which also holds
    # id-token: write) are rejected by crates.io. Branch restriction and
    # reviewers are configured in the repo's environment settings.
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        name: Resolve pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Check release App credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${CLIENT_ID}" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID is not set. Add the GitHub App Client ID as a repository variable — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
          if [ -z "${PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_PRIVATE_KEY is not set. Add the GitHub App private key as a repository secret — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: devdocs-mcp
          permission-contents: write
          permission-pull-requests: read
      # Trusted publishing: release-plz exchanges the job's OIDC token with
      # crates.io itself (id-token: write above); no CARGO_REGISTRY_TOKEN and
      # no crates-io-auth-action step.
      - uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
