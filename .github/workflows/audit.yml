name: audit

on:
  schedule:
    # Daily: cargo-deny and cargo-audit.
    - cron: "17 3 * * *"
    # Weekly: cargo-machete.
    - cron: "41 3 * * 1"
  workflow_dispatch:

# NOTE: the job-level `if:` guards below compare against these exact cron
# strings. Changing a cron here requires updating the matching guard(s).
permissions:
  contents: read

# Serialized (cancel-in-progress: false): a cancelled audit run reports as
# `cancelled`, not `failure`, so its failure would never reach the report
# job — a dropped security signal is worse than a queued one.
concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  deny:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - run: cargo audit

  machete:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-machete
      - run: cargo machete

  report:
    needs: [deny, audit, machete]
    # Scheduled runs only: a failing manual dispatch is seen in the Actions
    # UI by the person who ran it and must not open tracker issues.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // github.paginate walks every page and resolves to a flat array
            // of issues (not a response envelope), so dedup does not silently
            // degrade past the first 100 open issues.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependencies",
              per_page: 100,
            });
            const found = existing.find((issue) => issue.title.startsWith("Dependency audit failed"));
            const body = [
              "A scheduled dependency audit job failed.",
              "",
              `Run: ${runUrl}`,
              "",
              "Check `cargo deny check`, `cargo audit`, and `cargo machete` logs.",
            ].join("\n");
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body: `Recurrence (${date}). ${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Dependency audit failed (${date})`,
                labels: ["dependencies"],
                body,
              });
            }
