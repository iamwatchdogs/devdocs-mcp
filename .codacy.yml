---
# The migration files are SQLite DDL, verified against the bundled SQLite
# engine by the store tests. Codacy's SQL compatibility analyzer parses them
# with a PostgreSQL grammar and reports valid SQLite syntax (CREATE VIRTUAL
# TABLE, trigger bodies) as errors, so the directory stays out of analysis.
# The leading `**/` matters: the files live under crates/*/migrations/, and
# a root-relative `migrations/**` never matches them, so the analyzer also
# misreads the SQL as T-SQL and demands T-SQL session settings.
exclude_paths:
  - "**/migrations/**"
  # Workflow security is owned by zizmor and CodeQL in CI. Codacy's
  # GitHub-Actions pinning pattern misreads the local `$`-prefixed action
  # refs as unpinned third-party actions and reports false positives.
  - ".github/**"
  # The redaction tests hold synthetic secret-shaped fixture literals
  # (gitleaks github-pat, github-fine-grained-pat, aws-access-token,
  # private-key): by construction, they must match the redaction patterns.
  # The production redaction.rs stays analyzed — the inline test module
  # moved out of it so this exclusion never hides production code.
  - "**/redaction/tests.rs"
  # Same class as redaction/tests.rs: synthetic token literals for the
  # filter/pipeline fixtures.
  - "**/pipeline_fixture.rs"
  # One synthetic token literal (a proptest fixture).
  - "**/segment_props.rs"
  # One synthetic token literal (a quarantine seed fixture).
  - "**/retrieve_reads.rs"
  # The secret-scan config itself carries the exact fixture literals as
  # its allow-rule regexes, so every scanner flags them on the file.
  - "trivy-secret.yaml"
