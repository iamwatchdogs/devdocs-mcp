name: publish

# Trigger: a published GitHub release, or a manual recovery run that names an
# existing release tag. Never a push. A push-triggered release PR that
# auto-merged its own `chore: release` commit once looped forever; the
# reversal is recorded in docs/implementation/01-tech-stack-decision.md
# (2026-11-04) and docs/implementation/11-ci-cd-release.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string

# Workspace crates are versioned together (release-plz single-version mode,
# realized via Cargo workspace version inheritance; see release-plz.toml).
# devdocs-testkit stays `publish = false` and is skipped by release-plz.
# Setup (one-time): crates.io Trusted Publisher, a `v*` tag policy on the
# `crates` environment, and the release GitHub App used by release.yml — see
# docs/implementation/11-ci-cd-release.md "Publish to crates.io".
permissions:
  contents: read

# One publish at a time: two releases in quick succession must not race the
# dependency-ordered crates.io publish. Never cancel an in-flight publish.
concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish-crates:
    # Drafts never fire the release event, so no event guard is needed. A
    # manual dispatch is the recovery path for an existing release whose
    # publish job failed, and the step below requires that release to exist.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment gate for trusted publishing: the crates.io Trusted
    # Publisher entry names this environment, so OIDC tokens minted outside
    # it (e.g. by a compromised release.yml build leg, which also holds
    # id-token: write) are rejected by crates.io. Branch restriction and
    # reviewers are configured in the repo's environment settings.
    environment: crates
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qualified ref: actions/checkout prefers a same-named branch
          # (refs/remotes/origin/<ref>) over the tag for an unqualified ref,
          # which would publish the branch tip instead of the tagged commit.
          ref: "refs/tags/${{ github.event.release.tag_name || inputs.tag }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the ref is a published release on main
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a semver tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi
          # A dispatch names an arbitrary string. Require an existing,
          # non-draft release, so this workflow can only publish a release.
          if [[ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" == "true" ]]; then
            echo "::error::Release '${TAG}' is a draft. Publish the release, then rerun."
            exit 1
          fi
          # Branch protection gates main pushes, not tag pushes. A release
          # from an unmerged commit must not reach crates.io.
          git merge-base --is-ancestor HEAD origin/main
      - id: version
        name: Verify the tag matches the workspace version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${version}" ]; then
            echo "::error::Could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Release tag ${TAG} does not match workspace version v${version} in Cargo.toml. Bump Cargo.toml, commit, tag that commit, and publish the release."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - id: toolchain
        name: Resolve pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          # Match TOML basic (") and literal (') strings, with optional
          # surrounding whitespace; the BRE backreference keeps the quotes
          # paired (ERE backreferences are not POSIX-defined).
          channel="$(sed -n "s/^[[:space:]]*channel[[:space:]]*=[[:space:]]*\([\"']\)\([^\"']*\)\1.*/\2/p" rust-toolchain.toml | head -n 1)"
          if [ -z "${channel}" ]; then
            echo "::error::Could not read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # The registry never reuses a version number (docs/implementation/
      # 11-ci-cd-release.md, "Versioning policy"). A tag whose version is
      # already published passes every check above and only fails at the
      # crates.io upload, after the full release build. Advisory against
      # races: a concurrent publish between this check and release-plz
      # still fails at crates.io.
      - name: Verify no crate version already exists on crates.io
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "::error::The version-match step did not produce a version output"
            exit 1
          fi
          # crates.io rejects requests without a User-Agent header.
          ua="devdocs-mcp-release-guard (https://github.com/${GITHUB_REPOSITORY})"
          # Capture the crate list before the loop: with pipefail a failed
          # cargo metadata run aborts the step instead of skipping the check.
          # cargo metadata serializes `publish = false` as an empty list, so
          # publishable crates are selected by null or a non-empty list.
          crates="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name')"
          while IFS= read -r crate; do
            [ -n "${crate}" ] || continue
            status="$(curl -sS -o /tmp/crate-versions.json -w '%{http_code}' \
              -A "${ua}" "https://crates.io/api/v1/crates/${crate}")"
            if [ "${status}" = "404" ]; then
              echo "${crate}@${VERSION} is not on crates.io yet: first publish, allowed"
              continue
            fi
            if [ "${status}" != "200" ]; then
              echo "::error::crates.io returned HTTP ${status} for ${crate}; cannot verify version availability. Retry later."
              exit 1
            fi
            if jq -e --arg v "${VERSION}" '.versions[] | select(.num == $v) | .num' \
              /tmp/crate-versions.json >/dev/null; then
              echo "::error::${crate}@${VERSION} already exists on crates.io. The registry never reuses a version number. Bump [workspace.package] version above the newest published version (docs/implementation/11-ci-cd-release.md, 'Versioning policy'), commit, and tag that commit."
              exit 1
            fi
          done <<< "${crates}"
      # Trusted publishing: release-plz exchanges the job's OIDC token with
      # crates.io itself (id-token: write above); no CARGO_REGISTRY_TOKEN and
      # no crates-io-auth-action step. The `release` command only publishes
      # versions that Cargo.toml already carries; it never bumps, tags, or
      # opens a PR, so the read-only `github.token` is enough.
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
