# Local SAST rule set for `just opengrep`. Committed on purpose: the gate
# must run offline, so it never pulls rules from a registry. The rule IDs
# live in the devdocs.* namespace to stay independent of the Codacy cloud
# ruleset, whose findings carry their own nosemgrep suppressions.
rules:
  - id: devdocs.secrets.aws-access-key
    languages: [generic]
    severity: ERROR
    message: Possible hard-coded AWS access key ID. Load it from the environment or a config file instead.
    pattern-regex: AKIA[0-9A-Z]{16}

  - id: devdocs.secrets.github-token
    languages: [generic]
    severity: ERROR
    message: Possible hard-coded GitHub token. Load it from the environment or a config file instead.
    pattern-regex: gh[pousr]_[A-Za-z0-9]{36,}

  - id: devdocs.secrets.private-key-block
    languages: [generic]
    severity: ERROR
    message: Possible embedded private key. Reference a key file instead of committing key material.
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |PGP |DSA |ENCRYPTED )?PRIVATE KEY(-[A-Z]+)?-----'
