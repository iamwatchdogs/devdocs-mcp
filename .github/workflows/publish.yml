name: publish

# Trigger: a published GitHub release, or a manual recovery run that names an
# existing release tag. Never a push. A push-triggered release PR that
# auto-merged its own `chore: release` commit once looped forever; the
# reversal is recorded in docs/implementation/01-tech-stack-decision.md
# (2026-11-04) and docs/implementation/11-ci-cd-release.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string

# Workspace crates are versioned together (release-plz single-version mode,
# realized via Cargo workspace version inheritance; see release-plz.toml).
# devdocs-testkit stays `publish = false` and is skipped by release-plz.
# Setup (one-time): crates.io Trusted Publisher + the release GitHub App —
# see docs/implementation/11-ci-cd-release.md "Publish to crates.io".
permissions:
  contents: read

# One publish at a time: two releases in quick succession must not race the
# dependency-ordered crates.io publish. Never cancel an in-flight publish.
concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish-crates:
    # Drafts never fire the release event, so no event guard is needed. A
    # manual dispatch is the recovery path for an existing release whose
    # publish job failed, and the step below requires that release to exist.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment gate for trusted publishing: the crates.io Trusted
    # Publisher entry names this environment, so OIDC tokens minted outside
    # it (e.g. by a compromised release.yml build leg, which also holds
    # id-token: write) are rejected by crates.io. Branch restriction and
    # reviewers are configured in the repo's environment settings.
    environment: crates
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.release.tag_name || inputs.tag }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the ref is a published release on main
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a semver tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])"
            exit 1
          fi
          # A dispatch names an arbitrary string. Require an existing,
          # non-draft release, so this workflow can only publish a release.
          if [[ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" == "true" ]]; then
            echo "::error::Release '${TAG}' is a draft. Publish the release, then rerun."
            exit 1
          fi
          # Branch protection gates main pushes, not tag pushes. A release
          # from an unmerged commit must not reach crates.io.
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify the tag matches the workspace version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${version}" ]; then
            echo "::error::Could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Release tag ${TAG} does not match workspace version v${version} in Cargo.toml. Bump Cargo.toml, commit, tag that commit, and publish the release."
            exit 1
          fi
      - id: toolchain
        name: Resolve pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          # Match TOML basic (") and literal (') strings, with optional
          # surrounding whitespace; the BRE backreference keeps the quotes
          # paired (ERE backreferences are not POSIX-defined).
          channel="$(sed -n "s/^[[:space:]]*channel[[:space:]]*=[[:space:]]*\([\"']\)\([^\"']*\)\1.*/\2/p" rust-toolchain.toml | head -n 1)"
          if [ -z "${channel}" ]; then
            echo "::error::Could not read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Check release App credentials
        shell: bash
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${CLIENT_ID}" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID is not set. Add the GitHub App Client ID as a repository variable — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
          if [ -z "${PRIVATE_KEY}" ]; then
            echo "::error::RELEASE_APP_PRIVATE_KEY is not set. Add the GitHub App private key as a repository secret — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
          # Fail here, with a pointed message, instead of at the token step
          # whose only symptom is the opaque 401 "A JSON web token could not
          # be decoded". The allowed shapes and the storage commands live in
          # docs/implementation/11-ci-cd-release.md "Publish to crates.io".
          if [[ ! "${CLIENT_ID}" =~ ^Iv1\.[0-9a-f]{16}$ ]] \
            && [[ ! "${CLIENT_ID}" =~ ^Iv23[0-9A-Za-z]{14,20}$ ]] \
            && [[ ! "${CLIENT_ID}" =~ ^[0-9a-f]{20}$ ]]; then
            echo "::error::RELEASE_APP_CLIENT_ID does not look like a GitHub App Client ID. Client IDs look like 'Iv1.xxxxxxxxxxxxxxxx' or start with 'Iv23'; a 40-character hex value is usually the app's OAuth client secret. Copy the Client ID from the app's About section — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
          if ! printf '%s' "${PRIVATE_KEY}" | grep -q -- '-----BEGIN' \
            || ! printf '%s' "${PRIVATE_KEY}" | grep -q -- 'PRIVATE KEY-----'; then
            echo "::error::RELEASE_APP_PRIVATE_KEY does not look like a PEM private key (the '-----BEGIN ... PRIVATE KEY-----' markers are missing). Store the whole .pem file downloaded from the app settings: gh secret set RELEASE_APP_PRIVATE_KEY < path/to/app.private-key.pem"
            exit 1
          fi
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Follow the repo instead of a literal: a rename or fork keeps
          # publishing working (and the token stays scoped to this repo).
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
      # Trusted publishing: release-plz exchanges the job's OIDC token with
      # crates.io itself (id-token: write above); no CARGO_REGISTRY_TOKEN and
      # no crates-io-auth-action step. The `release` command only publishes
      # versions that Cargo.toml already carries; it never bumps, tags, or
      # opens a PR.
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
