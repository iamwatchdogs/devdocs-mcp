# Trivy secret-scanning config, auto-loaded by `just trivy`. The
# redaction module (docs/implementation/09 §Secrets and redaction) tests
# hold synthetic secret-shaped fixtures on purpose — matching those
# shapes is the module's job — so the synthetic literals are exempt from
# the secret scanner. There is no `path` scope: trivy's allow-rule
# `path` is not a regex scope but a whole-file kill switch (the scanner
# checks it before any rule, so a matching path skips secret scanning
# for the entire file — the previous entry silenced every credential in
# redaction.rs and this config). Each alternative is anchored to the
# complete detected region: trivy matches the allow regex as a substring
# of a detected region, so the `^…$` anchors bind each alternative to
# the full region and the optional non-word prefix consumes the one
# leading character regions may carry; a longer region merely containing
# a fixture (a real PEM holding the synthetic body, a longer token)
# still reports.
allow-rules:
  - id: synthetic-redaction-fixtures
    description: The synthetic fixture literals of the redaction module tests
    regex: "^(?:[^0-9a-zA-Z_])?ghp_0123456789abcdefghijklmnopqrstuvwxyz$|^(?:[^0-9a-zA-Z_])?abcdEFGHijklMNOPqrstT3BlbkFJuvwxyz$|^(?:[^0-9a-zA-Z_])?wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY$|^-----BEGIN [A-Z0-9_-]*PRIVATE KEY-----\\n(?:MIIEvQ){16}\\n-----END [A-Z0-9_-]* ?PRIVATE KEY-----$"
