name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workspace crates are versioned together (release-plz single-version mode,
# realized via Cargo workspace version inheritance; see release-plz.toml).
# devdocs-testkit stays `publish = false` and is skipped by release-plz.
# Setup (one-time): crates.io Trusted Publisher + the RELEASE_PLZ_TOKEN secret —
# see docs/implementation/11-ci-cd-release.md "Publish to crates.io".
permissions:
  contents: read

jobs:
  release-plz-pr:
    # Opens/updates the release PR. Uses RELEASE_PLZ_TOKEN (not GITHUB_TOKEN):
    # pull_request runs from a GITHUB_TOKEN-created PR land in an
    # approval-required state, while a PAT-created PR gets CI automatically.
    # The merge push is user-created either way, so the tag chain in
    # release-plz-release is unaffected.
    #
    # main-only: a manual dispatch from a feature branch must never evaluate
    # (let alone publish) non-main state; push events to main satisfy this.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: Check RELEASE_PLZ_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set. Create a fine-grained PAT (Contents: read/write and Pull requests: read/write on this repo) and store it as a repository secret — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
      # Without `command: release-pr` the action runs BOTH release-pr and
      # release; this job must only open/update the release PR.
      - uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-release:
    # Publishes crates and creates the version tag once the release PR is
    # merged; no-ops otherwise. Uses RELEASE_PLZ_TOKEN (not GITHUB_TOKEN) so
    # the tag push triggers release.yml for the binaries — GITHUB_TOKEN-
    # triggered events never start other workflow runs. release.yml owns the
    # GitHub release and its notes (release-plz.toml sets
    # git_release_enable = false).
    #
    # No concurrency group, deliberately (upstream guidance): with
    # cancel-in-progress: false a new queued run still replaces a pending
    # one, which can silently skip a release. A superseded run is mostly
    # self-healing — the newer run publishes the same or newer versions —
    # and a skipped release is worse than a doubled one.
    # main-only: a manual dispatch from a feature branch must never publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment gate for trusted publishing: the crates.io Trusted
    # Publisher entry names this environment, so OIDC tokens minted outside
    # it (e.g. by a compromised release.yml build leg, which also holds
    # id-token: write) are rejected by crates.io. Branch restriction and
    # reviewers are configured in the repo's environment settings.
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: Check RELEASE_PLZ_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set. Create a fine-grained PAT (Contents: read/write and Pull requests: read/write on this repo) and store it as a repository secret — see docs/implementation/11-ci-cd-release.md 'Publish to crates.io'."
            exit 1
          fi
      # Trusted publishing: release-plz exchanges the job's OIDC token with
      # crates.io itself (id-token: write above); no CARGO_REGISTRY_TOKEN and
      # no crates-io-auth-action step.
      - uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
