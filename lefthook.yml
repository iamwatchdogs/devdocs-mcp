# Hooks run via sh without the user's profile: rustup's cargo (~/.cargo/bin)
# is not on the default PATH, so every cargo command re-exports it below.
pre-commit:
  skip:
    - merge
    - rebase
  commands:
    fmt:
      glob: "*.rs"
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo fmt --all
      stage_fixed: true
    clippy:
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo clippy --workspace --all-targets -- -D warnings

commit-msg:
  skip:
    - merge
    - rebase
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE \
        '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .{1,72}$'
