# release-plz configuration: https://release-plz.dev/docs/configuration
#
# Publish-only mode. publish.yml runs `release-plz release` from a published
# GitHub release and never runs `release-pr`. release-plz must therefore never
# create a tag, a git release, or a PR: a release PR that auto-merges its own
# `chore: release` commit is the loop recorded in
# docs/implementation/01-tech-stack-decision.md (2026-11-04 reversal) and
# docs/implementation/11-ci-cd-release.md.
#
# Versioning mode: workspace crates version together via Cargo workspace
# version inheritance (`version.workspace = true` against the root Cargo.toml);
# no per-crate release-plz config is needed for that.

[workspace]
# release.yml owns the GitHub release object and its notes (it has the
# artifacts); release-plz only publishes crates.
git_release_enable = false
# The tag comes from the human release step and already exists when this runs.
# A tag created here would start release.yml a second time.
git_tag_enable = false
