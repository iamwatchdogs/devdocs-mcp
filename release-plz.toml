# release-plz configuration: https://release-plz.dev/docs/configuration
#
# Versioning mode: workspace crates version together via Cargo workspace
# version inheritance (`version.workspace = true` against the root Cargo.toml);
# no per-crate release-plz config is needed for that.

[workspace]
# release.yml owns the GitHub release object and its notes (it has the
# artifacts); release-plz only publishes crates and pushes the version tag.
# Two automated writers on one release would race and the changelog body
# would be replaced by auto-generated notes.
git_release_enable = false
# No per-package tags: release-plz's multi-package default is
# `{package}-v{version}`, which release.yml's `v*.*.*` trigger never matches.
git_tag_enable = false

# The binary crate pushes the single `v*.*.*` tag that fires release.yml.
# It is released last in dependency order, so the tag is created only after
# every other crate has published. Tag creation is skipped when the tag
# already exists, so re-runs are safe.
[[package]]
name = "devdocs"
git_tag_enable = true
git_tag_name = "v{{ version }}"
